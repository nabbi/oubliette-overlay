#https://raw.githubusercontent.com/gentoo-haskell/gentoo-haskell/master/.github/workflows/pkgcheck.yml
name: pkgcheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 18 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # The action already passes --exit GentooCI; the --exit below replaces it
    # with GentooCI plus the checks repoman used to treat as fatal (file.size,
    # metadata.*, dependency.badindev, inherit.missing, ...). Keep it on one
    # line: the comma list must stay a single argument.
    - name: Run pkgcheck
      uses: pkgcore/pkgcheck-action@v1
      with:
        args: >-
          --checks=-RedundantVersionCheck --keywords=-PotentialStable
          --exit GentooCI,NonsolvableDepsInDev,RequiredUseUnsatisfiableInStable,RequiredUseUnsatisfiableInDev,SizeViolation,TotalSizeViolation,ExecutableFile,PkgMissingMetadataXml,PkgBadlyFormedXml,PkgInvalidXml,PkgMetadataXmlInvalidPkgRef,PkgMetadataXmlInvalidCatRef,CatMissingMetadataXml,CatBadlyFormedXml,CatInvalidXml,UnknownKeywords,UnknownUseFlags,UnknownLicense,InvalidIdepend,MismatchedPN,EmptyPackageDir,CategoryIsNotDirectory,BannedEapi,BannedEapiCommand,BannedPhaseCall,DeadEclass,MissingInherits,ReadonlyVariable,BadHomepage,DuplicateFunctionDefinition,InvalidSandboxCall,DoublePrefixInPath

    # repoman's upstream.workaround has no pkgcheck equivalent. Advisory only,
    # like it was under repoman: annotates, never fails the job.
    - name: Flag serial make workarounds
      if: always()
      run: |
        grep -rnE '\b(emake|MAKEOPTS|make)\b.*(-j *1|--jobs[= ]1)\b' \
          --include='*.ebuild' --include='*.eclass' . \
          | sed -E 's#^(\./)?([^:]+):([0-9]+):.*#::warning file=\2,line=\3,title=upstream.workaround::\2:\3: serial make (-j1); fix the parallel build race instead#' \
          || true
