# generated 2023-06-21, Mozilla Guideline v5.7, nginx 1.17.7, OpenSSL 1.1.1k, modern configuration
# https://ssl-config.mozilla.org/#server=nginx&version=1.17.7&config=modern&openssl=1.1.1k&guideline=5.7

server {
    listen 80;
    listen [::]:80;
    http2 on;
    server_name = localhost $hostname;

    access_log /var/log/nginx/zoneminder.access_log main;
    error_log /var/log/nginx/zoneminder.error_log info;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name = localhost $hostname;

    root "/usr/share/zoneminder/www";
    access_log /var/log/nginx/zoneminder.ssl_access_log main;
    error_log /var/log/nginx/zoneminder.ssl_error_log info;

    ssl_certificate "/etc/ssl/nginx/zoneminder.crt";
    ssl_certificate_key "/etc/ssl/nginx/zoneminder.key";
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
    ssl_session_tickets off;

    # modern configuration
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Optimize static file delivery (event images, thumbnails, recordings)
    # sendfile reduces CPU overhead by using zero-copy kernel transfers.
    # tcp_nopush improves large file transfer efficiency.
    # tcp_nodelay keeps UI responses (PHP streaming / status updates) responsive.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Increase FastCGI buffers for ZoneMinder PHP responses.
    # Helps prevent "upstream sent too big header" errors.
    # Improves handling of large JSON responses and event metadata.
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    # HSTS (ngx_http_headers_module is required) (63072000 seconds)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Refuse multipart bodies before they reach PHP: PHP parses them before
    # any ZoneMinder code runs (PHP2Shell, CVE-2026-109618/109619). The only
    # ZoneMinder feature that needs multipart is the monitor CSV import
    # (Add Monitors); comment this out while you use it.
    if ($content_type ~* "^multipart/") {
        return 403;
    }

    # Auto redirect to server/zm when no url suffix was given
    #location = / {
    #    return 301 zm;
    #}

    # BEGIN api/v3
    # API v3: www-misc/zm-api on 127.0.0.1:8080, uncommented by USE=apiv3.
    # Maps zm-api's /api/v3, /swagger-ui and API document under /zm (also as
    # /zm/api-docs/v3/); APP_SERVER__PUBLIC_PREFIX=/zm puts /zm in its links.
    # X-Forwarded-For is the peer only: zm-api keys its login rate limit on
    # the first address, so a client-sent one must not pass.
    #location ^~ /zm/api/v3/ {
    #    proxy_pass http://127.0.0.1:8080/api/v3/;
    #    proxy_http_version 1.1;
    #    proxy_set_header Host $http_host;
    #    proxy_set_header X-Forwarded-For $remote_addr;
    #    proxy_set_header X-Real-IP $remote_addr;
    #    proxy_set_header X-Forwarded-Proto $scheme;
    #    proxy_set_header Upgrade $http_upgrade;
    #    proxy_set_header Connection $http_connection;
    #    proxy_buffering off;
    #    proxy_read_timeout 1h;
    #}
    #location = /zm/api-docs/openapi.json {
    #    proxy_pass http://127.0.0.1:8080/api-docs/openapi.json;
    #    proxy_set_header Host $http_host;
    #    proxy_set_header X-Forwarded-For $remote_addr;
    #}
    #location = /zm/api-docs/v3/openapi.json {
    #    proxy_pass http://127.0.0.1:8080/api-docs/openapi.json;
    #    proxy_set_header Host $http_host;
    #    proxy_set_header X-Forwarded-For $remote_addr;
    #}
    #location = /zm/api-docs/v3/ {
    #    return 302 /zm/swagger-ui/;
    #}
    #location ^~ /zm/swagger-ui {
    #    proxy_pass http://127.0.0.1:8080/swagger-ui;
    #    proxy_redirect /swagger-ui/ /zm/swagger-ui/;
    #    proxy_http_version 1.1;
    #    proxy_set_header Host $http_host;
    #    proxy_set_header X-Forwarded-For $remote_addr;
    #    proxy_set_header X-Real-IP $remote_addr;
    #    proxy_set_header X-Forwarded-Proto $scheme;
    #}
    # END api/v3

    # API documentation: /zm/api-docs/ lists what this install serves, v2/ is
    # zm-php-api's reference (USE=apiv2-php); the v3 entries come from the
    # api/v3 block above.
    location ^~ /zm/api-docs/ {
        alias "/usr/share/zoneminder/www/api-docs/";
        index index.html;
    }

    location /zm/cgi-bin {
        gzip off;
        alias "/usr/libexec/zoneminder/cgi-bin";

        include /etc/nginx/fastcgi_params_zoneminder;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/fcgiwrap-zoneminder.sock;
    }

    location /zm/cache {
        alias "/var/cache/zoneminder";
    }

    location /zm {
        gzip    off;
        alias   "/usr/share/zoneminder/www";
        index   index.php;

        # API: everything but the front controller goes through it. A regex,
        # first, so the .php and image ones can't run or serve api/ files.
        location ~ ^/zm/api/(?!app/webroot/index\.php$) {
            rewrite ^/zm/api(.+)$ /zm/api/app/webroot/index.php?p=$1 last;
        }

        location ~ \.php$ {
            try_files           $uri =404;
            expires             epoch;
            include             /etc/nginx/fastcgi_params_zoneminder;
            fastcgi_param       SCRIPT_FILENAME         $request_filename;
            fastcgi_index       index.php;
            fastcgi_pass        unix:/run/php-fpm.socket;
        }

        location ~ \.(jpg|jpeg|gif|png|ico)$ {
            access_log  off;
            expires     33d;
        }

    }

}

