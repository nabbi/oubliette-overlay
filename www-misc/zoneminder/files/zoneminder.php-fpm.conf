; This config file is needed when using ZoneMinder with web servers other
; than Apache. You can ignore this file if you are using Apache web server.
; Change the user and group of the default pool to the web server account
[www]

user = nginx
group = nginx

; Must match fastcgi_pass in zoneminder.nginx.conf
listen = /run/php-fpm/www.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

; These parameters are typically a tradoff between performance and memory
; consumption. See the contents of www.conf for details.

pm = ondemand
pm.max_children = 50
pm.process_idle_timeout = 10s

; Hardening against PHP2Shell (CVE-2026-109618/109619) and similar PHP
; request-startup bugs, which corrupt a worker on one request and exploit it
; on the next. Upgrading PHP is the fix; these limit the damage meanwhile.
; A fresh worker for every request (costs a process start per PHP request):
pm.max_requests = 1
; ZoneMinder does not use upload progress:
php_admin_flag[session.upload_progress.enabled] = off
